[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cfpwatch"
version = "0.1.0"
description = "Weekly monitor for special-issue calls for papers in management journals"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.6",
    "pydantic>=2",
    "pyyaml>=6",
    "rapidfuzz>=3",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
